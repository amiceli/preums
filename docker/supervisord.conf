[supervisord]
nodaemon=true

[program:php]
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --watch
directory=/var/www/html
autostart=true
autorestart=true
user=www-data

[program:vite]
command=npm run dev -- --host 0.0.0.0
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
